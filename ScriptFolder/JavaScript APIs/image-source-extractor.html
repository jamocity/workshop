<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Source Extractor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        img {
            max-width: 300px;
            margin: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .output {
            margin-top: 30px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
        }

   
  .image-gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }
  .image-gallery img {
    width: 220px;
    height: auto;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: transform 0.3s ease;
  }
  .image-gallery img:hover {
    transform: scale(1.05);
  }


    </style>
</head>
<body>
    <h1>Beautiful Images</h1>
    
    <div class="image-gallery">

</div>


    <div class="output" id="imageSources"></div>

    <script>
        var imgSet = document.getElementsByTagName("img");
        var output = "";
        for (var i = 0; i < imgSet.length; i++) {
            output += "<p>Source for image " + i + ": " + imgSet[i].src + "</p>";
        }
        document.getElementById("imageSources").innerHTML = output;
    </script>
</body>
