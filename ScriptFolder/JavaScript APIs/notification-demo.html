<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Notification Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f4f4f4;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    .notification {
      color: green;
      font-weight: bold;
      margin-top: 20px;
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>Welcome to My Demo Page</h1>
  <button onclick="showNotification('✅ Item added to cart!')">Add to Cart</button>

  <script>
    function showNotification(message) {
      var newPara = document.createElement("p");
      newPara.className = "notification";
      var newText = document.createTextNode(message);
      newPara.appendChild(newText);
      document.body.appendChild(newPara);

      // Remove the notification after 3 seconds
      setTimeout(() => {
        newPara.remove();
      }, 3000);
    }
  </script>

</body>
</html>
